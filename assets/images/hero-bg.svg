    <path d="M 1180 40 L 1180 140 L 1300 260"/>
    <path d="M 60 500 L 200 500 L 260 560 L 260 700"/>
    <path d="M 460 760 L 640 760 L 700 820"/>
  </g>

  <g fill="#34E0B0" fill-opacity="0.7">
