  </defs>

  <rect width="1400" height="900" fill="url(#dotgrid)"/>

  <circle cx="1080" cy="160" r="320" fill="url(#blobA)" filter="url(#blur1)"/>
  <circle cx="220" cy="680" r="260" fill="url(#blobB)" filter="url(#blur2)"/>

